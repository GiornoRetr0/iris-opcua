# Builds and tests the terminal installer (installer/) for every supported platform.
# Pushing a tag setup-cli-vX.Y.Z also publishes a GitHub Release with the binaries
# and SHA256SUMS; the tag keeps the name it had before the folder was renamed.
# Branch pushes and pull requests only build and test.

name: installer

on:
  push:
    branches: ["**"]
    tags: ["setup-cli-v*"]
    # Tag pushes ignore this filter, so a release always builds.
    paths:
      - "installer/**"
      - "backend/src/**"
      - "backend/native/linux-*/**"
      - ".github/workflows/installer.yml"
  pull_request:
    paths:
      - "installer/**"
      - "backend/src/**"
      - "backend/native/linux-*/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are static (musl) so they run on any distribution.
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true, test: true, ext: "" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true, test: true, ext: "" }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, musl: false, test: true, ext: "" }
          # Cross-compiled on the Apple Silicon runner, so its tests cannot run there.
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, musl: false, test: false, ext: "" }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, musl: false, test: true, ext: ".exe" }
    defaults:
      run:
        shell: bash
        working-directory: installer
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Test
        if: matrix.test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p ../dist
          cp "target/${{ matrix.target }}/release/iris-opcua-setup${{ matrix.ext }}" \
             "../dist/iris-opcua-setup-${{ matrix.name }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: iris-opcua-setup-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/setup-cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#setup-cli-v}"
          crate="$(grep -m1 '^version' installer/Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match installer/Cargo.toml version $crate"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum iris-opcua-setup-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#setup-cli-v}"
          cat > notes.md <<'EOF'
          Terminal installer for the IRIS OPC UA backend. Each file is self-contained: the ObjectScript classes and native libraries it installs are built in, so no repository checkout is needed.

          | File | For |
          |---|---|
          | `iris-opcua-setup-linux-x86_64` | Linux, Intel/AMD |
          | `iris-opcua-setup-linux-arm64` | Linux, ARM |
          | `iris-opcua-setup-macos-arm64` | Apple Silicon Macs |
          | `iris-opcua-setup-macos-x86_64` | Intel Macs |
          | `iris-opcua-setup-windows-x86_64.exe` | Windows |

          Verify with `SHA256SUMS`. On Linux/macOS, `chmod +x` the file first. The binaries are not code-signed: on macOS run `xattr -d com.apple.quarantine <file>` once (or right-click → Open); on Windows choose "More info → Run anyway" if SmartScreen warns.

          Installs onto Linux x86-64 and ARM64 IRIS servers. See [installer/README.md](https://github.com/GiornoRetr0/iris-opcua/blob/main/installer/README.md) for the required privileges and what it changes.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "iris-opcua-setup $version" \
            --notes-file notes.md
