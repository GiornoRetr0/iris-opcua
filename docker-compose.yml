services:
  iris:
    # No platform pin: the image builds for the host architecture. The base
    # intersystems/iris-community:2025.3 is multi-arch (amd64 + arm64/v8), and
    # docker/iris/Dockerfile picks the matching bin/unix/ set via TARGETARCH, so
    # Intel and Apple Silicon both build natively. Pinning linux/amd64 forced
    # emulation, which fails outright under OrbStack/Rosetta because IRIS needs
    # AVX instructions Rosetta does not translate.
    #
    # The context is the repository root, not docker/iris: the image needs
    # src/objectscript/ and bin/unix/, and Docker cannot COPY from outside its
    # context. .dockerignore keeps that context small.
    build:
      context: .
      dockerfile: docker/iris/Dockerfile
    depends_on:
      - plc
    hostname: iris
    init: true
    ports:
      - "51793:1972"     # superserver (vanilla IRIS uses 1972)
      - "52783:52773"    # web server / management portal

  plc:
    hostname: plc
    init: true
    image: intersystemsdc/opcua-mockserver:version-0.3.0
    ports:
      - "10000:4840"
    volumes:
      - type: bind
        source: ./fixtures/mocksvr-data/
        target: /app/data

  plc2:
    hostname: plc2
    init: true
    image: intersystemsdc/opcua-mockserver:version-0.3.0
    ports:
      - "10002:4840"
    volumes:
      - type: bind
        source: ./fixtures/mocksvr-data/
        target: /app/data

  certified-server:
    build: ./docker/certified-server
    hostname: certified-server
    init: true
    ports:
      - "10001:4840"
